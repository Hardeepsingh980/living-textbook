<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunrise School · Class 7 Science</title>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#13233a}
header{display:flex;align-items:center;gap:14px;padding:14px 32px;background:#13315c;color:#fff}
header b{font-size:20px} header span{opacity:.8}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:24px 32px}
nav{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(19,49,92,.08);font-size:15px;line-height:2.1}
nav .on{color:#1a63d6;font-weight:700}
main{background:#fff;border-radius:14px;padding:20px 24px;box-shadow:0 2px 10px rgba(19,49,92,.08)}
h1{font-size:24px;margin:0 0 6px} p{margin:0 0 14px;color:#4a5b75}
button{font:600 15px system-ui;padding:10px 18px;border-radius:10px;border:0;background:#1a63d6;color:#fff;cursor:pointer;margin-top:14px}
</style></head><body>
<header><b>Sunrise School</b><span>Class 7 · Science · Week 3</span></header>
<div class="wrap">
  <nav><div>Home</div><div class="on">Motion and Time</div><div>Heat</div><div>Electric current</div><div>Assignments</div></nav>
  <main>
    <h1>Lesson: the simple pendulum</h1>
    <p>Watch the page come alive, ask the tutor, then take the quiz.</p>
    <div id="lesson"></div>
    <button id="scan">Scan a page from your book</button>
  </main>
</div>
<script src="SERVER/sdk/v1.js" data-key="ltpk_YOUR_PUBLISHABLE_KEY"></script>
<script>
  window.__events = [];
  const lt = LivingTextbook();
  lt.lesson('#lesson', { lessonId: 'LESSON_ID', height: 470, onEvent: (e) => window.__events.push('lesson ' + e.type) });
  document.getElementById('scan').onclick = () => lt.scanner({ onLesson: (l) => window.__events.push('scanner lesson ' + l.id) });
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Living Book · tracking spike</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px/1.3 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #frozen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #page { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; pointer-events: none; display: none; }
  #page .sheet { position: absolute; inset: 0; border: 3px solid rgba(80,220,255,.9); box-shadow: 0 0 24px rgba(80,220,255,.5) inset; border-radius: 6px; }
  #page .title { position: absolute; left: 6%; top: 5%; width: 88%; padding: 2.5% 3%; background: rgba(20,20,40,.75); color: #fff; font-size: 44px; border-radius: 12px; }
  #page .ball { position: absolute; width: 11%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffb3b3, #e63946 60%, #7a1020); box-shadow: 0 10px 20px rgba(0,0,0,.4); left: 20%; top: 40%; animation: bounce 1.6s ease-in-out infinite; }
  #page .label { position: absolute; left: 36%; top: 62%; padding: 2% 3%; background: #ffd166; color: #222; font-size: 40px; border-radius: 10px; }
  #page .fig { position: absolute; border: 4px dashed rgba(255,209,102,.9); border-radius: 8px; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(140%); } }
  #hud { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #stats { background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 8px; white-space: pre; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  #controls { position: fixed; left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 6px; }
  button, select { font: 15px system-ui; padding: 10px 12px; border-radius: 10px; border: 0; background: #2d6cdf; color: #fff; }
  button.secondary { background: #444; }
  button:disabled { opacity: .4; }
  #log { position: fixed; left: 8px; right: 8px; bottom: calc(64px + env(safe-area-inset-bottom)); max-height: 34vh; overflow: auto; background: rgba(0,0,0,.65); padding: 6px 8px; border-radius: 8px; font: 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; display: none; }
  #log.open { display: block; }
  #quad { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <img id="frozen" alt="" />
  <canvas id="quad"></canvas>
  <div id="page">
    <div class="sheet"></div>
    <div class="title">The page comes alive</div>
    <div class="ball"></div>
    <div class="label">h = ½ g t²</div>
  </div>
</div>
<div id="hud"><div id="stats">idle</div></div>
<div id="log"></div>
<div id="controls">
  <select id="res"><option value="1280">720p</option><option value="1920" selected>1080p</option></select>
  <select id="tw"><option value="640">target 640</option><option value="800" selected>target 800</option><option value="1000">target 1000</option></select>
  <button id="start">Start camera</button>
  <button id="capture" disabled>Capture + track</button>
  <button id="reset" class="secondary" disabled>Reset</button>
  <button id="compileBrowser" class="secondary" disabled>Compile in browser</button>
  <button id="toggleLog" class="secondary">Log</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
